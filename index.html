                    Utils.showToast('تم حذف جميع السجلات');
                } catch { Utils.showToast('حدث خطأ أثناء الحذف', true); }
            },

            printReport() {
                const win = window.open('', '_blank');
                win.document.write(`<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><title>تقرير جلسات الموظفين</title>
                <style>body{font-family:'Cairo',sans-serif;padding:20px}h1{color:#2D5A27}table{width:100%;border-collapse:collapse;margin-top:20px}th{background:#2D5A27;color:white;padding:10px}td{padding:8px;border-bottom:1px solid #ddd;text-align:center}</style>
                </head><body><h1>تقرير جلسات الموظفين - تل السنديان</h1><p>تاريخ: ${new Date().toLocaleDateString('ar-EG')}</p>
                <table><thead><tr><th>المستخدم</th><th>وقت الدخول</th><th>وقت الخروج</th><th>المدة</th></tr></thead>
                <tbody>${AppState.staffSessions.map(s => `<tr><td>${s.username}</td>
                <td>${new Date(s.loginTime).toLocaleString('ar-EG')}</td>
                <td>${s.logoutTime ? new Date(s.logoutTime).toLocaleString('ar-EG') : 'لم يسجل'}</td>
                <td>${Utils.formatDuration(s.loginTime, s.logoutTime)}</td></tr>`).join('')}
                </tbody></table></body></html>`);
                win.document.close();
                setTimeout(() => win.print(), 500);
            }
        };

        // ───────────────────────────────────────────
        //  MenuManager (نفس الكود)
        // ───────────────────────────────────────────
        const MenuManager = {
            renderCategories() {
                const container = document.getElementById('categories');
                if (!container) return;
                container.innerHTML = `
                    <button class="sync-btn" onclick="MenuManager.openCategoryModal()" style="margin-bottom:15px;">
                        <i class="fas fa-plus"></i> إضافة صنف
                    </button>
                    ${AppState.categories.map(c => `
                        <div class="item-card">
                            <div class="item-info"><h3>${c.name}</h3><p>${c.description || ''}</p></div>
                            <div class="item-actions">
                                <button class="edit-btn" onclick='MenuManager.editCategory(${JSON.stringify(c).replace(/'/g,"\\'")})'><i class="fas fa-pen"></i></button>
                                <button class="delete-btn" onclick="MenuManager.deleteItem('categories','${c.id}')"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>`).join('')}`;
            },

            renderProducts() {
                const filter    = document.getElementById('filterCategory')?.value || '';
                let filtered    = AppState.products;
                if (filter) filtered = filtered.filter(p => p.categoryId === filter);
                const container = document.getElementById('productsList');
                if (!container) return;
                container.innerHTML = filtered.map(p => {
                    const cat    = AppState.categories.find(c => c.id === p.categoryId);
                    const margin = p.cost ? ((p.price - p.cost) / p.price * 100).toFixed(0) : 0;
                    return `<div class="item-card">
                        <div class="item-info">
                            <h3>${p.name} ${p.isNew ? '<span style="color:green;">(جديد)</span>' : ''}</h3>
                            <p>${cat ? cat.name : 'غير مصنف'} | ${p.description || ''}</p>
                            <div class="item-price">${p.price} د.أ</div>
                            ${p.cost ? `<div class="item-cost">التكلفة: ${p.cost} د.أ (هامش: ${margin}%)</div>` : ''}
                        </div>
                        <div class="item-actions">
                            <button class="edit-btn" onclick='MenuManager.editProduct(${JSON.stringify(p).replace(/'/g,"\\'")})'><i class="fas fa-pen"></i></button>
                            <button class="delete-btn" onclick="MenuManager.deleteItem('products','${p.id}')"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>`;
                }).join('');
            },

            openCategoryModal(item = { id:'', name:'', description:'', image:'', order:0 }) {
                AppState.editingItem = item.id ? item : null;
                document.getElementById('modalTitle').innerText = AppState.editingItem ? 'تعديل صنف' : 'إضافة صنف';
                document.getElementById('editForm').innerHTML = `
                    <div class="form-group"><label>الاسم</label><input type="text" id="cat_name" value="${item.name}"></div>
                    <div class="form-group"><label>الوصف</label><textarea id="cat_desc">${item.description || ''}</textarea></div>
                    <div class="form-group"><label>رابط الصورة</label><input type="text" id="cat_image" value="${Utils.cleanImageUrl(item.image)}"></div>
                    <div class="form-group"><label>الترتيب</label><input type="number" id="cat_order" value="${item.order || 0}"></div>
                    <button type="button" class="submit-form-btn" onclick="MenuManager.saveCategory()"><i class="fas fa-save"></i> حفظ</button>`;
                document.getElementById('modalOverlay').classList.add('active');
            },

            async saveCategory() {
                const data = {
                    id:          AppState.editingItem ? AppState.editingItem.id : Utils.generateId(),
                    name:        document.getElementById('cat_name').value,
                    description: document.getElementById('cat_desc').value,
                    image:       document.getElementById('cat_image').value,
                    order:       parseInt(document.getElementById('cat_order').value) || 0
                };
                if (AppState.editingItem) {
                    const idx = AppState.categories.findIndex(c => c.id === AppState.editingItem.id);
                    if (idx !== -1) AppState.categories[idx] = data;
                } else { AppState.categories.push(data); }
                this.renderCategories();
                App.UI.closeModal();
                await API.saveToServer('categories', AppState.categories);
            },

            editCategory(item) { this.openCategoryModal(item); },

            openProductModal(item = { id:'', categoryId:'', name:'', description:'', price:0, cost:0, image:'', isNew:false, order:0 }) {
                AppState.editingItem = item.id ? item : null;
                document.getElementById('modalTitle').innerText = AppState.editingItem ? 'تعديل منتج' : 'إضافة منتج';
                const catOptions = AppState.categories.map(c => `<option value="${c.id}" ${c.id===item.categoryId?'selected':''}>${c.name}</option>`).join('');
                document.getElementById('editForm').innerHTML = `
                    <div class="form-group"><label>الصنف</label><select id="prod_catId">${catOptions}</select></div>
                    <div class="form-group"><label>الاسم</label><input type="text" id="prod_name" value="${item.name}"></div>
                    <div class="form-group"><label>الوصف</label><textarea id="prod_desc">${item.description || ''}</textarea></div>
                    <div class="form-group"><label>سعر البيع</label><input type="number" step="0.1" id="prod_price" value="${item.price}"></div>
                    <div class="form-group"><label>تكلفة المنتج</label><input type="number" step="0.1" id="prod_cost" value="${item.cost||0}"></div>
                    <div class="form-group"><label>رابط الصورة</label><input type="text" id="prod_image" value="${Utils.cleanImageUrl(item.image)}"></div>
                    <div class="form-group"><label>جديد؟</label><select id="prod_isNew">
                        <option value="false" ${!item.isNew?'selected':''}>لا</option>
                        <option value="true" ${item.isNew?'selected':''}>نعم</option>
                    </select></div>
                    <div class="form-group"><label>الترتيب</label><input type="number" id="prod_order" value="${item.order||0}"></div>
                    <button type="button" class="submit-form-btn" onclick="MenuManager.saveProduct()"><i class="fas fa-save"></i> حفظ</button>`;
                document.getElementById('modalOverlay').classList.add('active');
            },

            async saveProduct() {
                const data = {
                    id:          AppState.editingItem ? AppState.editingItem.id : Utils.generateId(),
                    categoryId:  document.getElementById('prod_catId').value,
                    name:        document.getElementById('prod_name').value,
                    description: document.getElementById('prod_desc').value,
                    price:       parseFloat(document.getElementById('prod_price').value) || 0,
                    cost:        parseFloat(document.getElementById('prod_cost').value)  || 0,
                    image:       document.getElementById('prod_image').value,
                    isNew:       document.getElementById('prod_isNew').value === 'true',
                    order:       parseInt(document.getElementById('prod_order').value)   || 0
                };
                if (AppState.editingItem) {
                    const idx = AppState.products.findIndex(p => p.id === AppState.editingItem.id);
                    if (idx !== -1) AppState.products[idx] = data;
                } else { AppState.products.push(data); }
                this.renderProducts();
                App.UI.closeModal();
                await API.saveToServer('products', AppState.products);
            },

            editProduct(item) { this.openProductModal(item); },

            async deleteItem(type, id) {
                if (!confirm('تأكيد الحذف؟')) return;
                AppState[type] = AppState[type].filter(i => i.id !== id);
                if (type === 'categories') this.renderCategories();
                else this.renderProducts();
                await API.saveToServer(type, AppState[type]);
            }
        };

        // ───────────────────────────────────────────
        //  UI – التنقل بين التبويبات
        // ───────────────────────────────────────────
        const UI = {
            closeModal() { document.getElementById('modalOverlay').classList.remove('active'); },

            async switchTab(tab) {
                AppState.currentTab = tab;
                document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                const tabLabels = {
                    categories: 'الأصناف', products: 'المنتجات', sales: 'المبيعات',
                    reports: 'الأرباح', inventory: 'المخزون', staff: 'سجل الموظفين'
                };
                const activeBtn = Array.from(document.querySelectorAll('.tab-btn'))
                    .find(btn => btn.innerText.includes(tabLabels[tab] || tab));
                if (activeBtn) activeBtn.classList.add('active');

                const content = document.getElementById('contentArea');
                if (!content) return;

                if (tab === 'categories') {
                    content.innerHTML = `<div class="tab-content active" id="categories"></div>`;
                    MenuManager.renderCategories();

                } else if (tab === 'products') {
                    content.innerHTML = `<div class="tab-content active" id="products">
                        <select id="filterCategory" class="input-field" style="margin-bottom:15px;" onchange="MenuManager.renderProducts()">
                            <option value="">جميع الأصناف</option>
                            ${AppState.categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
                        </select>
                        <div id="productsList"></div>
                        <button class="sync-btn" onclick="MenuManager.openProductModal()"><i class="fas fa-plus"></i> إضافة منتج</button>
                    </div>`;
                    MenuManager.renderProducts();

                } else if (tab === 'sales') {
                    content.innerHTML = `<div class="tab-content active" id="sales">
                        <div class="sales-header">
                            <div class="sales-filter-row">
                                <select id="salesStatusFilter" class="filter-select" onchange="SalesManager.applyFilter()">
                                    <option value="all">جميع الطلبات</option>
                                    <option value="preparing">قيد التحضير</option>
                                    <option value="completed">مكتملة</option>
                                </select>
                                <div class="date-picker">
                                    <label>من:</label> <input type="date" id="salesDateFrom" class="date-input">
                                    <label>إلى:</label> <input type="date" id="salesDateTo" class="date-input">
                                </div>
                                <div class="date-preset-buttons">
                                    <button class="date-preset-btn" onclick="SalesManager.setPreset('today')">اليوم</button>
                                    <button class="date-preset-btn" onclick="SalesManager.setPreset('yesterday')">أمس</button>
                                    <button class="date-preset-btn" onclick="SalesManager.setPreset('week')">7 أيام</button>
                                    <button class="date-preset-btn" onclick="SalesManager.setPreset('month')">الشهر</button>
                                    <button class="date-preset-btn" onclick="SalesManager.setPreset('all')">الكل</button>
                                </div>
                                <button class="apply-filter-btn" onclick="SalesManager.applyFilter()"><i class="fas fa-filter"></i> تطبيق</button>
                                <button class="refresh-sales-btn" onclick="SalesManager.refreshOrders()"><i class="fas fa-sync-alt"></i> تحديث</button>
                            </div>
                        </div>
                        <div id="salesList" class="orders-grid"></div>
                    </div>`;
                    SalesManager.initDates();
                    await SalesManager.refreshOrders();

                } else if (tab === 'reports') {
                    content.innerHTML = `<div class="tab-content active" id="reports">
                        <div class="reports-header">
                            <div class="date-range-picker">
                                <div><label>من:</label> <input type="date" id="startDate" class="date-input"></div>
                                <div><label>إلى:</label> <input type="date" id="endDate" class="date-input"></div>
                                <button class="refresh-sales-btn" onclick="ReportsManager.applyRange()"><i class="fas fa-filter"></i> تطبيق</button>
                                <button class="refresh-sales-btn" onclick="SalesManager.refreshOrders(); ReportsManager.applyRange();"><i class="fas fa-sync-alt"></i> تحديث</button>
                            </div>
                            <div class="preset-buttons">
                                <button class="preset-btn active" onclick="ReportsManager.setPreset('today',event)">اليوم</button>
                                <button class="preset-btn" onclick="ReportsManager.setPreset('yesterday',event)">أمس</button>
                                <button class="preset-btn" onclick="ReportsManager.setPreset('week',event)">هذا الأسبوع</button>
                                <button class="preset-btn" onclick="ReportsManager.setPreset('month',event)">هذا الشهر</button>
                                <button class="preset-btn" onclick="ReportsManager.setPreset('year',event)">هذه السنة</button>
                                <button class="preset-btn" onclick="ReportsManager.setPreset('all',event)">الكل</button>
                            </div>
                        </div>
                        <div class="stats-cards">
                            <div class="stat-card"><div class="stat-icon"><i class="fas fa-coins"></i></div><div class="stat-label">إجمالي المبيعات</div><div class="stat-value" id="totalSales">0 د.أ</div></div>
                            <div class="stat-card profit-card"><div class="stat-icon"><i class="fas fa-sack-dollar"></i></div><div class="stat-label">صافي الربح</div><div class="stat-value" id="totalProfit">0 د.أ</div></div>
                            <div class="stat-card"><div class="stat-icon"><i class="fas fa-receipt"></i></div><div class="stat-label">عدد الطلبات</div><div class="stat-value" id="totalOrders">0</div></div>
                            <div class="stat-card"><div class="stat-icon"><i class="fas fa-chart-pie"></i></div><div class="stat-label">متوسط نسبة الربح</div><div class="stat-value" id="avgMargin">0%</div></div>
                        </div>
                        <div class="chart-container"><canvas id="salesChart"></canvas></div>
                        <div class="top-products-table">
                            <h3 style="margin-bottom:15px"><i class="fas fa-crown" style="color:var(--clay-brown)"></i> تحليل الأرباح للمنتجات</h3>
                            <table id="topProductsTable">
                                <thead><tr><th>المنتج</th><th>الكمية</th><th>الإيراد</th><th>التكلفة</th><th>صافي الربح</th><th>هامش الربح</th></tr></thead>
                                <tbody></tbody>
                            </table>
                        </div>
                    </div>`;
                    await SalesManager.refreshOrders();
                    ReportsManager.setPreset(ReportsManager.currentPreset);

                } else if (tab === 'inventory') {
                    const categories = [...new Set(AppState.manualInventory.map(i => i.category).filter(Boolean))];
                    content.innerHTML = `<div class="tab-content active" id="inventory">
                        <div class="inventory-stats-row" id="invStatsRow"></div>
                        <div class="inventory-header">
                            <div class="inventory-title"><i class="fas fa-boxes"></i> إدارة المخزون</div>
                            <div class="inventory-actions">
                                <button class="action-btn small" onclick="InventoryManager.openAddModal()">
                                    <i class="fas fa-plus"></i> إضافة مادة
                                </button>
                                <button class="action-btn small" onclick="InventoryManager.syncFromServer()">
                                    <i class="fas fa-cloud-download-alt"></i> مزامنة
                                </button>
                                <button class="action-btn small" onclick="InventoryManager.exportData()">
                                    <i class="fas fa-download"></i> تصدير
                                </button>
                                <button class="action-btn small" onclick="InventoryManager.importData()">
                                    <i class="fas fa-upload"></i> استيراد
                                </button>
                            </div>
                        </div>
                        <div class="inventory-search-bar">
                            <input type="text" class="inventory-search-input" placeholder="🔍 ابحث عن مادة..."
                                id="invSearchInput"
                                oninput="InventoryManager.render(this.value, document.getElementById('invCatFilter').value)">
                            <select id="invCatFilter" class="inventory-category-filter"
                                onchange="InventoryManager.render(document.getElementById('invSearchInput').value, this.value)">
                                <option value="all">جميع التصنيفات</option>
                                ${categories.map(c => `<option value="${c}">${c}</option>`).join('')}
                            </select>
                        </div>
                        <div class="inventory-grid" id="inventoryGrid"></div>
                    </div>`;
                    InventoryManager.render();

                } else if (tab === 'staff') {
                    const users = [...new Set(AppState.staffSessions.map(s => s.username))];
                    content.innerHTML = `<div class="tab-content active" id="staff">
                        <div class="staff-header">
                            <div class="staff-filter-row">
                                <select id="staffUserFilter" class="filter-select">
                                    <option value="all">جميع المستخدمين</option>
                                    ${users.map(u => `<option value="${u}">${u}</option>`).join('')}
                                </select>
                                <div class="date-picker">
                                    <label>من:</label> <input type="date" id="staffDateFrom" class="date-input">
                                    <label>إلى:</label> <input type="date" id="staffDateTo" class="date-input">
                                </div>
                                <button class="apply-filter-btn" onclick="StaffManager.applyFilter()"><i class="fas fa-filter"></i> تطبيق</button>
                                <button class="date-preset-btn" onclick="StaffManager.setPreset('today')">اليوم</button>
                                <button class="date-preset-btn" onclick="StaffManager.setPreset('yesterday')">أمس</button>
                                <button class="date-preset-btn" onclick="StaffManager.setPreset('week')">7 أيام</button>
                                <button class="date-preset-btn" onclick="StaffManager.setPreset('month')">الشهر</button>
                                <button class="date-preset-btn" onclick="StaffManager.setPreset('all')">الكل</button>
                            </div>
                            <div style="display:flex;gap:10px;margin-top:10px;">
                                <button class="refresh-sales-btn" onclick="StaffManager.loadSessions()"><i class="fas fa-sync-alt"></i> تحديث</button>
                                <button class="refresh-sales-btn" style="background:linear-gradient(145deg,#8b1c1c,#c0392b)"
                                    onclick="StaffManager.clearAllSessions()"><i class="fas fa-trash-alt"></i> حذف السجل</button>
                                <button class="refresh-sales-btn" onclick="StaffManager.printReport()"><i class="fas fa-print"></i> طباعة</button>
                            </div>
                        </div>
                        <div class="staff-table-container">
                            <table class="staff-table">
                                <thead><tr><th>المستخدم</th><th>وقت الدخول</th><th>وقت الخروج</th><th>المدة</th></tr></thead>
                                <tbody id="staffTableBody"></tbody>
                            </table>
                        </div>
                    </div>`;
                    StaffManager.loadSessions();
                }
            }
        };

        // ───────────────────────────────────────────
        //  التطبيق الرئيسي
        // ───────────────────────────────────────────
        window.App = {
            async attemptLogin() {
                const u = document.getElementById('username').value;
                const p = document.getElementById('password').value;
                if (u === CONFIG.CREDENTIALS.user && p === CONFIG.CREDENTIALS.pass) {
                    document.getElementById('errorMsg').style.display = 'none';
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('postLoginWrapper').style.display = 'flex';
                    document.getElementById('appContainer').classList.add('active');

                    try { await DB.init(); } catch(e) { console.warn('DB init failed:', e); }

                    await InventoryManager.load();
                    await Promise.allSettled([
                        API.fetchMenu(),
                        API.loadOrders(false),
                        API.loadStaffSessions()
                    ]);

                    UI.switchTab('categories');
                } else {
                    document.getElementById('errorMsg').style.display = 'block';
                }
            },

            logout() {
                document.getElementById('appContainer').classList.remove('active');
                document.getElementById('postLoginWrapper').style.display = 'none';
                document.getElementById('loginScreen').style.display = 'block';
            },

            async refreshAllData() {
                Utils.showToast('جاري التحديث...');
                await InventoryManager.load();
                await Promise.allSettled([
                    API.fetchMenu(true),
                    API.loadOrders(true),
                    API.loadStaffSessions()
                ]);
                UI.switchTab(AppState.currentTab);
                Utils.showToast('✅ تم تحديث جميع البيانات');
            },

            refreshSales() {
                SalesManager.refreshOrders();
            },

            syncOrdersFromServer() {
                if (confirm('سيتم جلب آخر الطلبات من السيرفر. هل تريد المتابعة؟')) {
                    Utils.showToast('جاري المزامنة...');
                    SalesManager.refreshOrders();
                }
            },

            switchTab: (tab) => UI.switchTab(tab),
            UI
        };

        window.MenuManager      = MenuManager;
        window.InventoryManager = InventoryManager;
        window.SalesManager     = SalesManager;
        window.ReportsManager   = ReportsManager;
        window.StaffManager     = StaffManager;

        // أوراق الخريف 🍂
        (function createLeaves() {
            const lc = document.getElementById('fallingLeaves');
            if (!lc) return;
            for (let i = 0; i < 30; i++) {
                const leaf = document.createElement('div');
                leaf.className = 'leaf';
                leaf.textContent = ['🌿','🍂','🍃'][Math.floor(Math.random() * 3)];
                leaf.style.left = Math.random() * 100 + '%';
                leaf.style.animationDuration = (Math.random() * 10 + 12) + 's';
                leaf.style.animationDelay    = (Math.random() * -20) + 's';
                lc.appendChild(leaf);
            }
        })();

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && document.getElementById('loginScreen').style.display !== 'none') {
                App.attemptLogin();
            }
        });

    })();
    </script>
</body>
</html>
